services:
  database:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: rag-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - rag_postgres_data:/var/lib/postgresql
      - ./database_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${DB_USER} -d ${DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-app
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DB_HOST: database
      DB_PORT: "5432"
      HF_HOME: /models/huggingface

    ports:
      - "8000:8000"

    volumes:
      - rag_uploaded_files:/app/data
      - rag_model_cache:/models/huggingface

volumes:
  rag_postgres_data:
  rag_uploaded_files:
  rag_model_cache: